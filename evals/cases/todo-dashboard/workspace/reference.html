<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My tasks</title>
<style>body{font:16px system-ui;max-width:900px;margin:auto;padding:24px;background:#f6f7fb;color:#172033}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:white;padding:20px;border-radius:12px}button,input,select{font:inherit;padding:8px}</style>
<h1>My tasks</h1><h2>Completion summary</h2>
<section class="summary" aria-label="Completion summary"><div class="card">Total tasks</div><div class="card">Completed</div><div class="card">Active</div><div class="card">Completion rate</div></section>
<h2>Task list</h2><label>New task <input id="new-title"></label><button>Add task</button>
<label>Show <select><option>All</option><option>Active</option><option>Completed</option></select></label>
</html>
